#=======================================================================
# DbxLoadGen - load generator settings
#-----------------------------------------------------------------------
# Read in this order (later wins):
#   1. ${DBXTUNE_HOME}/conf/loadgen.properties   (this file)
#   2. ~/.dbxtune/loadgen/loadgen.properties
#   3. the file given with -c / --config
# Everything here is commented out: the values shown are the defaults in the code.
# List the scenarios with: loadgen.sh scenarios
#=======================================================================

#-----------------------------------------------------------------------
# Intensity: threads and think time (ms between two units of work)
# OLAP workers wait (think * 5 + 2000) ms. During a 5 minute "wave"
# (runs of 15 minutes or more) the think time is x 0.3.
#-----------------------------------------------------------------------
#intensity.low.oltpThreads=4
#intensity.low.olapThreads=1
#intensity.low.thinkMinMs=200
#intensity.low.thinkMaxMs=1000

#intensity.medium.oltpThreads=10
#intensity.medium.olapThreads=2
#intensity.medium.thinkMinMs=50
#intensity.medium.thinkMaxMs=500

#intensity.high.oltpThreads=25
#intensity.high.olapThreads=4
#intensity.high.thinkMinMs=0
#intensity.high.thinkMaxMs=100

#-----------------------------------------------------------------------
# Scenarios
#   scenario.<name>.enabled=false     switch one off
#   scenario.<name>.weight=N          OLTP/OLAP/BATCH: share of the work (0 = off)
#   scenario.<name>.everyMinutes=N    PROBLEM: how often (0 = off), first time at a random offset
#-----------------------------------------------------------------------
#scenario.new_order.weight=30
#scenario.payment.weight=20
#scenario.order_status.weight=20
#scenario.stock_check.weight=10
#scenario.customer_search.weight=10
#scenario.delivery.weight=5

#scenario.sales_by_month.weight=30
#scenario.top_customers.weight=25
#scenario.rolling_window.weight=20
#scenario.order_report.weight=15
#scenario.etl_fact_sales.weight=10

#scenario.purge_audit.weight=3
#scenario.update_stats.weight=2
#scenario.bulk_events.weight=3

# Every holdSeconds/durationSeconds below gets this many seconds extra (+ 0-9 s random), so a problem doesn't stop
# at a round number and is still active in one more DbxTune sample (30 s sample + ~5 s to take it). 0 = off.
#problem.extraSeconds=35

#scenario.blocking.everyMinutes=10
#scenario.blocking.holdSeconds=120
#scenario.blocking.waiters=3

#scenario.deadlock.everyMinutes=7

#scenario.long_tran.everyMinutes=15
#scenario.long_tran.holdSeconds=300

#scenario.sort_spill.everyMinutes=10

#scenario.literal_sql.everyMinutes=6
#scenario.literal_sql.durationSeconds=60

#scenario.non_sargable.everyMinutes=4
#scenario.non_sargable.durationSeconds=60

#scenario.hot_spot.everyMinutes=12
#scenario.hot_spot.durationSeconds=60
#scenario.hot_spot.sessions=6

#scenario.rbar_cursor.everyMinutes=10
# rows handled by the cursor procedure (each one scans stock), default 20000000 / stock rows, 10-500
#scenario.rbar_cursor.maxRows=100

#scenario.n_plus_one.everyMinutes=5
#scenario.n_plus_one.durationSeconds=60

#scenario.temp_recompile.everyMinutes=8
#scenario.temp_recompile.durationSeconds=60

#scenario.conn_churn.everyMinutes=10
#scenario.conn_churn.durationSeconds=60

#scenario.errors.everyMinutes=5
#scenario.errors.durationSeconds=60

#------------------------------------------------------------------
# compare: what did DbxTune see of a run (reads DbxCentral)
#------------------------------------------------------------------
#central.url=http://dbxc-host:8080
# DbxCentral's server name for a loadgen --name (they usually differ)
#central.srv.gs-2-win=GS-2-WIN__SS_2025
# only if DbxCentral has DbxTuneCentral.login.mandatory=true: its DbxTune.central.registration.token
#central.token=
#compare.grace=120s
#compare.graph.factor=2
#compare.graph.minDelta=0.5
# row checks (CM rows per sample, e.g. "was the blocking holder in CmActiveStatements"): samples to look at per check,
# and how long after a problem a sample of a slow CM (CmExecQueryStats, CmIndexMissing) still counts
#compare.rows.maxSamples=8
#compare.rows.lookAheadMinutes=60
