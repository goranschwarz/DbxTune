##---------------------------------------------------------
## How many second to sleep between sampling data
##---------------------------------------------------------
offline.sampleTime = 30




##---------------------------------------------------------
## What is the default Counter template to use.
## This will be used for future CounterModels that are not yet created.
## So if a new CM is part of template 'SMALL|MEDIUM|LARGE|ALL', it will still be created, even if not part of this config file.
##---------------------------------------------------------
