## Writer: PersistWriterJdbc -------------------------
PersistWriterJdbc.jdbcDriver = org.h2.Driver
PersistWriterJdbc.jdbcPasswd = encrypted:BdsuSrLtZkY=
PersistWriterJdbc.jdbcUrl = jdbc:h2:file:${DBXTUNE_SAVE_DIR}/${SERVERNAME}_${DATE:format=yyyy-MM-dd;roll=true}
PersistWriterJdbc.jdbcUser = sa
PersistWriterJdbc.startH2NetworkServer = true

## Writer: PersistWriterToDbxCentral -------------------------
## Default URL is 'http://localhost:<port>/api/pcs/receiver', where <port> is DbxCentral's web port on the machine the collector runs on:
##   - Windows:    80 (or property 'DbxTuneCentral.web.http.port.windows')
##   - Linux/Unix: 8080 (or property 'DbxTuneCentral.web.http.port')
#PersistWriterToDbxCentral.url = USE_DEFAULT:http://localhost:80/api/pcs/receiver
PersistWriterToDbxCentral.writer.type = http

