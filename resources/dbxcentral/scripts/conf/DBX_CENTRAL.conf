##================================================================================
## BEGIN: MCP - Model Context Protocol Server
##   Allows AI assistants (Claude, etc.) to connect to DbxCentral and analyze
##   database performance data via natural language.
##
##   Client config (e.g. Claude Desktop claude_desktop_config.json):
##   {
##     "mcpServers": {
##       "dbxcentral": {
##         "url": "http://your-host:8080/mcp",
##         "headers": { "Authorization": "Bearer your-secret-token" }
##       }
##     }
##   }
##
##   Available MCP tools:
##     list_servers, list_metrics, get_metric_data, get_performance_summary,
##     get_wait_stats, get_blocking_info, get_top_queries, get_active_statements,
##     get_memory_analysis, get_io_analysis, get_tempdb_usage,
##     get_active_alarms, get_alarm_history, get_dbms_config (if enabled below)
##--------------------------------------------------------------------------------

## Enable the MCP endpoint at POST /mcp  (default: false)
## NOTE: Must be explicitly enabled — disabled by default for security.
DbxTuneCentral.mcp.enabled = false

## API token required in Authorization header: "Bearer <token>"
## If left empty, MCP access requires a valid DbxCentral browser login session cookie.
## Recommendation: always set a token when mcp.enabled = true
#DbxTuneCentral.mcp.apiToken = your-secret-token-here

## Comma-separated list of IP addresses allowed to call /mcp
## Default: localhost only.  Set to empty string to allow any IP (use with caution).
DbxTuneCentral.mcp.allowedHosts = 127.0.0.1

## Maximum time range an MCP client can query in a single call (hours)
## Prevents runaway queries on large H2 databases. Default: 168 (7 days)
DbxTuneCentral.mcp.maxTimeRangeHours = 168

## Expose DBMS configuration data via the get_dbms_config tool
## Config data may include sensitive settings — disabled by default
DbxTuneCentral.mcp.exposeDbmsConfig = false

## Enable server-push alarm notifications via SSE at GET /mcp
## When true, clients can subscribe to real-time alarm events
DbxTuneCentral.mcp.sseNotificationsEnabled = false

##--------------------------------------------------------------------------------
## END: MCP - Model Context Protocol Server
##================================================================================
