##================================================================================
## BEGIN: LLM - SQL Optimization Advice
##   Lets the Daily Summary Report, the Active Statements web dialog, and the
##   Showplan viewer send a SQL statement (plus its DDL/index/stats and,
##   where available, its execution plan) to an LLM and show back an
##   optimization suggestion. Configure at least one provider below.
##
##   API keys may be stored encrypted instead of in plain text: encrypt with
##   Configuration.encryptPropertyValue(propName, apiKey) and store the
##   resulting "encrypted:..." string as the property value.
##================================================================================

## Master switch for the whole feature. Default is false (disabled) - this is still rough around
## the edges in places, so it must be explicitly turned on. While false: the API endpoints reject
## requests, /llm-advice shows a "not enabled" page, and no trigger UI (Daily Summary Report links,
## Active Statements buttons, Showplan Optimization Advice section) renders at all.
#DbxCentral.llm.enabled=false

## The user picks the model in a dropdown (every model of every configured provider below) and presses
## "Get Advice" - nothing is sent to an LLM before that. This is the provider whose first model is
## preselected (the browser then remembers the user's last choice). Default: the first configured provider.
## One of: claude, openai, gemini, vertex, bedrock, foundry, ollama - or a name in 'extraProviders'.
## A comma separated list is an order of preference: the first one that is configured is used. An unknown name,
## or none configured, is written to the log as a warning, and the first configured provider is used.
#DbxCentral.llm.provider=claude

## Allow the LLM endpoints (/api/llm/optimize-sql, /api/llm/context) to be used by callers
## that are NOT logged in. Default is false (login required), i.e. the same rule as every
## other /api/... endpoint. Only set this to true if you understand the implications
## (anyone who can reach DbxCentral could then spend your configured LLM provider's quota).
#DbxCentral.llm.allowAnonymous=false

## Saved requests: every LLM call (who, when, server, model, tokens, duration, the SQL, the answer and the
## full prompt) is saved as one HTML file in <DBXTUNE_SAVE_DIR>/llm-advice-log/. Admins can list and open
## them on the Admin page (/admin/llm-log). A one-line 'LLM-ADVICE:' entry is always written to the log.
## Under each answer the user gets a link to the saved request (and how long it is kept): ANY user can open
## that link (/llm-log, same login rule as asking for advice), so requests can be shared.
#DbxCentral.llm.log.save=true
## Saved requests older than this are removed by the daily 'DataDirectoryCleaner' (0 = keep forever)
#DbxCentral.llm.log.keep.days=90

##----------------------------------
## Models and model settings - the same for every provider
##----------------------------------
## 'model' is a comma separated list: all are offered in the dropdown, the first is the provider's default.
##     DbxCentral.llm.claude.model=claude-opus-5-5, claude-sonnet-5-5
##
## A name in the list is the model id, unless '<provider>.<name>.model' is set: then the name is your own
## short name (letters, digits, - and _) and that setting holds the model id. That way a model can get its own
## settings, and the same model can be offered more than once with different settings:
##     DbxCentral.llm.claude.model=opus, opus-max, claude-sonnet-5-5
##     DbxCentral.llm.claude.opus.model=claude-opus-5-5
##     DbxCentral.llm.claude.opus.label=Opus 5.5 (high effort)
##     DbxCentral.llm.claude.opus.extraBody={"output_config":{"effort":"high"}}
##     DbxCentral.llm.claude.opus-max.model=claude-opus-5-5
##     DbxCentral.llm.claude.opus-max.label=Opus 5.5 (max effort - slow and costly)
##     DbxCentral.llm.claude.opus-max.extraBody={"output_config":{"effort":"max"}}
##     DbxCentral.llm.claude.opus-max.maxTokens=64000
##
## Settings for a model: 'DbxCentral.llm.<provider>.<name>.<setting>'. The same settings WITHOUT the name
## ('DbxCentral.llm.<provider>.<setting>') apply to all models of the provider (a model's own setting wins):
##   label        - text in the dropdown (default: the name)
##   extraBody    - JSON that is deep-merged into the request body just before it is sent: objects are merged,
##                  other values replace, null removes. For new parameters of new models, without a DbxTune
##                  upgrade: 'effort' (Claude), 'reasoning_effort' (OpenAI), 'generationConfig' (Gemini), ...
##                  Provider level first, then the model's.
##   extraHeaders - JSON object with extra (or replacing) HTTP headers, e.g. {"anthropic-beta":"..."}.
##                  Never logged, never shown in the browser. ${ENV_VAR} can be used for secrets.
##   maxTokens    - cap on the answer (thinking included) for the Claude format and Bedrock Converse, default 16000.
##                  The answer is cut where the cap is hit (then the advice shows a "cut off" note): raise it if so.
##                  With high/max effort the model may use it all on thinking: then you get an error that says so.
##   timeout      - seconds. A streamed answer (see 'stream') is stopped only after this many seconds WITHOUT new content
##                  (default 300): while the model reports what it is doing, it is not stopped. Not streamed answers
##                  (gemini, openai, ollama, bedrock Converse) send nothing until done: there it is the total time (default 600).
##                  The user can also press Stop while waiting: the LLM call is then cancelled too (and its cost).
##   stream       - true (default): the answer is streamed, so the user sees what the model is doing while waiting
##                  ("thinking", "writing the answer", and its thinking as a growing list). Claude models (claude, vertex,
##                  foundry, bedrock anthropic.*) and Gemini (gemini, vertex Gemini models); not yet openai, ollama,
##                  bedrock Converse. false for a gateway/proxy without streaming.
##                  The thinking text is also shown, folded, under the answer ("LLM's Thinking Process"). How it is asked for:
##                  - Claude: thinking.display=summarized, only from a model seen thinking anyway (so it never turns
##                    thinking on); the models seen thinking are kept in <DBXTUNE_SAVE_DIR>/llm-advice-log/models-seen-thinking.txt
##                    (delete the file to forget them). Turn it off for a model: extraBody={"thinking":{"type":"adaptive"}}
##                  - Gemini: generationConfig.thinkingConfig.includeThoughts=true (it does not turn thinking on). Turn it
##                    off for a model with your own thinkingConfig in extraBody.
##                  A model that does not take the request is asked again without it, and remembered until a restart.
##   format       - Google Cloud and Bedrock only, for model ids that do not follow today's naming:
##                  vertex: anthropic|gemini, bedrock: messages|converse
## Every provider also has 'displayName' (the dropdown group) and 'url' (replaces the endpoint: a company
## gateway or proxy, or a private endpoint: AWS VPC endpoint, GCP Private Service Connect, Azure Private Link).
## Settings are read on every request: a change needs no restart.

##----------------------------------
## Claude (Anthropic)
##----------------------------------
## Get an API key at https://console.anthropic.com/
#DbxCentral.llm.claude.apiKey=<Anthropic API key>
#DbxCentral.llm.claude.model=claude-opus-5-5, claude-sonnet-5-5
## An Anthropic-compatible company gateway (then the apiKey is optional)
#DbxCentral.llm.claude.url=https://api.anthropic.com

##----------------------------------
## ChatGPT (OpenAI) - and every server with the same API: company LLM gateways (LiteLLM, ...),
## Azure OpenAI (v1 API), vLLM, LM Studio, Mistral, DeepSeek, Groq, OpenRouter, ...
##----------------------------------
## Get an API key at https://platform.openai.com/
#DbxCentral.llm.openai.apiKey=<OpenAI API key>
#DbxCentral.llm.openai.model=gpt-4o
## Another server: LiteLLM http://host:4000/v1, Azure OpenAI https://<resource>.openai.azure.com/openai/v1, LM Studio http://host:1234/v1
#DbxCentral.llm.openai.url=https://api.openai.com/v1
## Header for the API key: 'Authorization' sends 'Bearer <key>', any other header the key as is (Azure OpenAI: api-key)
#DbxCentral.llm.openai.authHeader=Authorization
## A server without JSON mode: remove it from the request
#DbxCentral.llm.openai.extraBody={"response_format":null}

##----------------------------------
## Gemini (Google AI Studio)
##----------------------------------
## Get an API key at https://aistudio.google.com/
#DbxCentral.llm.gemini.apiKey=<Google AI Studio API key>
#DbxCentral.llm.gemini.model=gemini-2.0-flash

##----------------------------------
## Google Cloud: Vertex AI / Model Garden - Claude and Gemini models, billed to your GCP project
## Needs the Agent Platform API enabled, the models enabled in Model Garden, and the IAM role
## 'Agent Platform User' (roles/aiplatform.user) for the identity below.
##----------------------------------
#DbxCentral.llm.vertex.projectId=<GCP project id>

## global (recommended), us / eu (multi-region), or a region like us-east5 (regional: Claude Sonnet 4.6 and older only)
#DbxCentral.llm.vertex.region=global

## Credentials. Default: Google "Application Default Credentials" = env GOOGLE_APPLICATION_CREDENTIALS, else the file of
## 'gcloud auth application-default login' (of the user running DbxCentral), else the metadata server (GCE VM, GKE, Cloud Run).
## Or a file of your own: a service-account key, a gcloud login, a Workload Identity Federation config (keyless from AWS,
## Azure or any OIDC provider - for organizations that do not allow service-account keys), or an impersonated service account.
#DbxCentral.llm.vertex.credentialsFile=/path/to/credentials.json

## "Claude Models on Google Cloud (Anthropic managed)" instead of Vertex AI for the claude* models: your workspace id
## (IAM role claude.user; same credentials as above)
#DbxCentral.llm.vertex.claudeWorkspaceId=<workspace id>

## Example: Claude Opus 5.5 twice in the dropdown, with different 'effort' (own short names + '.model' = the model id;
## 'extraBody' is merged into the request; thinking tokens count against 'maxTokens', so raise it for 'max')
#DbxCentral.llm.vertex.model=opus-max, opus, claude-sonnet-5-5, gemini-2.5-pro

#DbxCentral.llm.vertex.opus-max.model=claude-opus-5-5
#DbxCentral.llm.vertex.opus-max.label=Opus 5.5 (max effort)
#DbxCentral.llm.vertex.opus-max.extraBody={"output_config":{"effort":"max"}}
#DbxCentral.llm.vertex.opus-max.maxTokens=64000

#DbxCentral.llm.vertex.opus.model=claude-opus-5-5
#DbxCentral.llm.vertex.opus.label=Opus 5.5 (high effort)
#DbxCentral.llm.vertex.opus.extraBody={"output_config":{"effort":"high"}}

##----------------------------------
## Amazon Bedrock - anthropic.* = Claude (Messages API), any other model id = the Converse API (inference
## profiles like global.anthropic.claude-opus-4-6-v1, meta.*, amazon.nova-*, ARNs, ...)
##----------------------------------
#DbxCentral.llm.bedrock.region=us-east-1
#DbxCentral.llm.bedrock.model=anthropic.claude-opus-5-5, anthropic.claude-sonnet-5-5
## Credentials. Default: the standard AWS credential chain = env AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, ~/.aws/credentials
## and ~/.aws/config (incl. SSO and assume-role) of the user running DbxCentral, web identity (EKS), the ECS task role, the
## EC2 instance profile. Or a named profile:
#DbxCentral.llm.bedrock.profile=<AWS profile name>
## Or a Bedrock API key (bearer token) instead of IAM credentials (env AWS_BEARER_TOKEN_BEDROCK also works)
#DbxCentral.llm.bedrock.apiKey=<Bedrock API key>

##----------------------------------
## Microsoft Foundry (Azure) - Claude deployments, billed through the Azure Marketplace
## (other Azure models: use the 'openai' type with the Azure OpenAI v1 URL)
##----------------------------------
#DbxCentral.llm.foundry.resource=<Foundry resource name>
## or the full endpoint instead of 'resource':
#DbxCentral.llm.foundry.url=https://<resource>.services.ai.azure.com/anthropic
## Your DEPLOYMENT names
#DbxCentral.llm.foundry.model=claude-opus-5-5
## The API key from the deployment's Details tab
#DbxCentral.llm.foundry.apiKey=<Foundry API key>
## Without an apiKey a Microsoft Entra ID token is used, from: a service principal (tenantId + clientId + clientSecret,
## or env AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET), else AKS workload identity (env AZURE_FEDERATED_TOKEN_FILE),
## else a managed identity (Azure VM, App Service; clientId = a user-assigned identity). Needs the role 'Foundry User'.
#DbxCentral.llm.foundry.tenantId=<tenant id>
#DbxCentral.llm.foundry.clientId=<client id>
#DbxCentral.llm.foundry.clientSecret=<client secret>
## Sovereign clouds only
#DbxCentral.llm.foundry.authorityHost=https://login.microsoftonline.com

##----------------------------------
## Ollama (local) - no API key needed, useful if you don't want SQL/DDL
## text leaving your network. Requires Ollama running with a model pulled.
##----------------------------------
#DbxCentral.llm.ollama.url=http://localhost:11434
#DbxCentral.llm.ollama.model=llama3

##----------------------------------
## Extra providers: more providers of one of the types above, for services that speak the same API
## (Mistral, DeepSeek, Groq, OpenRouter, a company gateway, a second Azure resource, ...).
## A comma separated list of names of your own; each is configured like the type it is, under its own name.
##----------------------------------
#DbxCentral.llm.extraProviders=mistral
#DbxCentral.llm.mistral.type=openai
#DbxCentral.llm.mistral.displayName=Mistral
#DbxCentral.llm.mistral.url=https://api.mistral.ai/v1
#DbxCentral.llm.mistral.apiKey=<Mistral API key>
#DbxCentral.llm.mistral.model=mistral-large-latest

##================================================================================
## END: LLM - SQL Optimization Advice
