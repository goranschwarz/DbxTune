##=====================================================
## DBX_CENTRAL.conf
## A template or starting point for DBX Central Configuration
##=====================================================

##=====================================================
## DbxCentral Web ports
##  - On Windows the port are at the lower (normal) range.
##  - On Linux/Unix ordinary users can't start on ports below 1024
##    So on Linux use the firewall to redirect from port 80 to 8080
## Note: for HTTPS to work files 'cert.pem' and 'key.pem' need to be present in directory ${DBXTUNE_CENTRAL_CONF_DIR}/ssl
##=====================================================
#DbxTuneCentral.web.http.port          = 8080
#DbxTuneCentral.web.https.port         = 8443
#DbxTuneCentral.web.http.port.windows  = 80
#DbxTuneCentral.web.https.port.windows = 443


##=====================================================
## Public URL for DBX Central
## This can be used if DbxCentral physical hostname is not the same as the PUBLIC name
## Possibly if it's behind some Proxy Server or load balancer etc...
## This will be used as a 'base' URL for various messages and HTTP Links
## Default: current hostname
##=====================================================
#DbxCentral.public.base.url = http://dbxtune.acme.com


##=====================================================
## Fallback mail configuration if you don't want to specify it *everywhere*
##=====================================================
#mail.to            = some_name@acme.com
#mail.from          = some_name@acme.com
#mail.smtp.hostname = smtp.acme.com
#mail.start.tls     = true
#mail.smtp.port     = 587
#mail.smtp.username = some_name@acme.com
#mail.smtp.password = *secret*


##=====================================================
## BEGIN: Alarms specific
##-----------------------------------------------------
