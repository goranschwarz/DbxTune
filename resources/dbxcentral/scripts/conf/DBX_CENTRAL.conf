#AlarmHandler.enable      = true

## TO FILE
#AlarmWriterToFile.active.filename = ${HOME}/.dbxtune/dbxc/log/ALARM.ACTIVE.DbxCentral.txt
#AlarmWriterToFile.log.filename    = ${HOME}/.dbxtune/dbxc/log/ALARM.LOG.DbxCentral.log

## TO MAIL
